<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="bull" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Grid lines -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#1e293b" stroke-dasharray="6,6" stroke-width="2" />
  <line x1="80" y1="260" x2="432" y2="260" stroke="#1e293b" stroke-dasharray="6,6" stroke-width="2" />
  <line x1="80" y1="360" x2="432" y2="360" stroke="#1e293b" stroke-dasharray="6,6" stroke-width="2" />

  <!-- Candlesticks -->
  <!-- Candle 1: Red/neutral -->
  <line x1="140" y1="220" x2="140" y2="340" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
  <rect x="126" y="240" width="28" height="60" rx="4" fill="#ef4444" />

  <!-- Candle 2: Green Bullish -->
  <line x1="220" y1="170" x2="220" y2="310" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <rect x="206" y="195" width="28" height="85" rx="4" fill="url(#bull)" />

  <!-- Candle 3: Big Green Breakout -->
  <line x1="300" y1="120" x2="300" y2="280" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <rect x="286" y="140" width="28" height="100" rx="4" fill="url(#bull)" />

  <!-- Candle 4: Peak Green -->
  <line x1="380" y1="80" x2="380" y2="240" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <rect x="366" y="100" width="28" height="90" rx="4" fill="url(#bull)" />

  <!-- Trend Pulse Glow Line -->
  <path d="M 80 330 Q 150 310 210 240 T 320 180 T 432 90" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="432" cy="90" r="10" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="432" cy="90" r="5" fill="#ffffff" />

  <!-- Badge IDX / WIB Tag -->
  <g transform="translate(146, 410)">
    <rect width="220" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <text x="110" y="27" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#10b981" text-anchor="middle" letter-spacing="2">IDX PRE-OPEN</text>
  </g>
</svg>
